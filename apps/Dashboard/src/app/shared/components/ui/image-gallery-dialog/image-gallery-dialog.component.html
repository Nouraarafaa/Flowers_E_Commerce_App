<p-dialog 
    [(visible)]="visible" 
    [modal]="true" 
    [draggable]="false" 
    [resizable]="false"
    [closable]="true"
    [style]="{ width: '50vw' }"
    [breakpoints]="{
    '960px': '75vw',
    '640px': '95vw'}"
    styleClass="custom-image-dialog"
    maskStyleClass="custom-mask"
    >

    <!-- image & images -->
    <div class="bg-white rounded-2xl p-3 md:p-5 flex items-center justify-center min-h-[250px] md:min-h-[400px]">
        @if (images().length > 0) {
            <img [src]="images()[currentIndex()]" 
                class="max-w-full max-h-[60vh] object-contain rounded-lg shadow-sm" 
                alt="Product">
        }
    </div>

    <!-- Pagination & Arrows -->
    <div class="flex justify-between items-center mt-8 px-2">
        <div class="flex gap-2">
            @for (img of images(); track $index) {
                <div class="w-2.5 h-2.5 rounded-full transition-all duration-300"
                    [class.bg-[#7A1D1D]]="$index === currentIndex()"
                    [class.bg-zinc-200]="$index !== currentIndex()">
                </div>
            }
        </div>

        <div class="flex gap-4">
            <button type="button" 
                    (click)="prev()"
                    [disabled]="currentIndex() === 0"
                    class="w-11 h-11 rounded-full border border-zinc-200 flex items-center justify-center text-zinc-400 hover:bg-zinc-50 disabled:opacity-30 transition-all cursor-pointer">
                <i class="pi pi-chevron-left"></i>
            </button>
            <button type="button" 
                    (click)="next()"
                    [disabled]="currentIndex() === images().length - 1"
                    class="w-11 h-11 rounded-full border border-zinc-200 flex items-center justify-center text-[#7A1D1D] hover:bg-zinc-50 disabled:opacity-30 transition-all cursor-pointer">
                <i class="pi pi-chevron-right"></i>
            </button>
        </div>
    </div>
</p-dialog>
